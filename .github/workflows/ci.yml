name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-arch:
    name: Arch Linux (Qt 6 + KF6)
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Headless runner: no display server, so Qt must use the offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        parquet: [ON, OFF]
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-svg kio solid kcoreaddons kservice syntax-highlighting \
            $([ "${{ matrix.parquet }}" = ON ] && echo arrow)
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DFUIN_WITH_PARQUET=${{ matrix.parquet }} -DFUIN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Tests
        # The rename tests need a session bus for KIO's change notifications.
        run: dbus-run-session -- ctest --test-dir build --output-on-failure -LE bench
      - name: Smoke test (headless)
        run: |
          ./build/fuin --version
          ./build/fuin --context --format markdown README.md > /dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                         '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | ./build/fuin --mcp | grep -q fuin_context_pack
      - name: Install into a staging dir
        run: DESTDIR=$PWD/stage cmake --install build --prefix /usr && find stage -type f
