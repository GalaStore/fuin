name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the GitHub Release
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-svg qt6-tools kio solid kcoreaddons kservice syntax-highlighting arrow \
            github-cli
      - uses: actions/checkout@v7
      - name: Check that the tag matches the version
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^project(fuin VERSION $version " CMakeLists.txt
          grep -q "<release version=\"$version\"" packaging/io.github.galactuuus.fuin.metainfo.xml
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DFUIN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Tests
        run: dbus-run-session -- ctest --test-dir build --output-on-failure -LE bench
      - name: Release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Fūin $GITHUB_REF_NAME" --notes-file notes.md
