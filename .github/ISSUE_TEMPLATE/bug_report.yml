name: Bug report
description: Something in Fūin doesn't work as expected
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can; it makes the bug much faster to reproduce.
        **Security issues** (for example a secret leaking into a context pack or to an MCP client) must be reported privately: see [SECURITY.md](https://github.com/GalaStore/fuin/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open `~/some/folder`
        2. Press F3
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Screenshots are welcome (without personal data).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fūin version
      description: Output of `fuin --version`.
      placeholder: fuin 0.1.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: Arch Linux, Fedora 42, ...
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop / compositor
      description: Wayland or X11 too, if you know it.
      placeholder: Hyprland (Wayland), KDE Plasma 6, Sway, GNOME, ...
    validations:
      required: true
  - type: input
    id: qt-kf6
    attributes:
      label: Qt and KDE Frameworks versions
      description: "On Arch: `pacman -Q qt6-base kio`."
      placeholder: Qt 6.10.0, KF6 6.19.0
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - AUR / PKGBUILD
        - Built from source
        - Other (please describe above)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output of `fuin` started from a terminal, or of `fuin --mcp` for MCP issues. Rendered as a shell block automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the [existing issues](https://github.com/GalaStore/fuin/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I removed secrets (tokens, keys, passwords, private paths) from the logs and screenshots.
          required: true
